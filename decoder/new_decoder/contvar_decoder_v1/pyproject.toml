[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contvar-decoder"
version = "1.0.0"
description = "Frozen-feature GO-conditioned paired protein-variant decoder"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.2", "h5py>=3.11", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["contvar_decoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
