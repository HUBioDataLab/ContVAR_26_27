<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840">
<title>ContVAR v1 frozen feature GO-conditioned paired decoder</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:bold}.label{font-size:17px;font-weight:bold}.small{font-size:15px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.go{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.head{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}.line{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arrow)}</style>
<rect width="1120" height="840" fill="white"/>
<text x="35" y="42" class="title">ContVAR Decoder v1 — uygulanan mimari</text>
<text x="35" y="69" class="small">Frozen encoder · mutation-site + global · 128-D hidden · dört attention head</text>
<rect x="35" y="100" width="340" height="68" rx="10" class="box"/><text x="53" y="128" class="label">WT_mut + WT_global</text><text x="53" y="151" class="small">İki girdi: her biri B × 1280</text>
<rect x="745" y="100" width="340" height="68" rx="10" class="box"/><text x="763" y="128" class="label">VAR_mut + VAR_global</text><text x="763" y="151" class="small">İki girdi: her biri B × 1280</text>
<rect x="435" y="100" width="250" height="105" rx="10" class="go"/><text x="453" y="129" class="label">GO: Anc2vec B × 200</text><text x="453" y="155" class="small">LayerNorm → Linear 200→128</text><text x="453" y="181" class="small">→ GELU = q_GO</text>
<path d="M205 168 V195" class="line"/><path d="M915 168 V195" class="line"/>
<rect x="35" y="195" width="340" height="100" rx="10" class="box"/><text x="53" y="224" class="label">Ölçek adapter'ları</text><text x="53" y="250" class="small">LayerNorm → Linear 1280→128 → GELU</text><text x="53" y="276" class="small">+ type embedding → B × 2 × 128</text>
<rect x="745" y="195" width="340" height="100" rx="10" class="box"/><text x="763" y="224" class="label">Aynı adapter ağırlıkları</text><text x="763" y="250" class="small">LayerNorm → Linear 1280→128 → GELU</text><text x="763" y="276" class="small">+ type embedding → B × 2 × 128</text>
<path d="M205 295 V330" class="line"/><path d="M915 295 V330" class="line"/>
<rect x="35" y="330" width="340" height="142" rx="10" class="box"/><text x="53" y="359" class="label">Shared reader: WT geçişi</text><text x="53" y="386" class="small">1 self-attention block: 128 / 4 heads</text><text x="53" y="411" class="small">GO cross-attention + residual + norm</text><text x="53" y="436" class="small">FFN 128→256→128 + residual + norm</text><text x="53" y="460" class="small">h_WT: B × 128</text>
<rect x="745" y="330" width="340" height="142" rx="10" class="box"/><text x="763" y="359" class="label">Shared reader: VAR geçişi</text><text x="763" y="386" class="small">Aynı reader parametreleri</text><text x="763" y="411" class="small">GO query / protein keys ve values</text><text x="763" y="436" class="small">Aynı FFN / residual / norm</text><text x="763" y="460" class="small">h_VAR: B × 128</text>
<path d="M435 175 H404 V395 H375" class="line"/><path d="M685 175 H716 V395 H745" class="line"/>
<text x="449" y="315" class="small">WT ve VAR aynı ağı kullanır.</text><text x="449" y="339" class="small">Her tarafta iki özet token.</text><text x="449" y="363" class="small">GO aynı işlevi sorgular.</text>
<path d="M205 472 V503 H560 V535" class="line"/><path d="M915 472 V503 H560" class="line"/>
<path d="M560 205 V246 H700 V503" class="line"/>
<rect x="35" y="535" width="500" height="130" rx="10" class="head"/><text x="54" y="565" class="label">Joint: fark almama</text><text x="54" y="592" class="small">concat(h_WT, h_VAR, q_GO): B × 384</text><text x="54" y="618" class="small">Linear 384→128 → LayerNorm → GELU → Dropout 0.1</text><text x="54" y="644" class="small">Pair representation: B × 128</text>
<rect x="585" y="535" width="500" height="130" rx="10" class="head"/><text x="604" y="565" class="label">Score difference: fark alma</text><text x="604" y="592" class="small">scorer([h_WT,q_GO]) ve aynı scorer([h_VAR,q_GO])</text><text x="604" y="618" class="small">256→128→1/2 · LayerNorm · GELU · dropout yok</text><text x="604" y="644" class="small">Δs = s_VAR − s_WT; embedding farkı eklenmez</text>
<path d="M560 535 H285" class="line"/><path d="M560 535 H835" class="line"/>
<path d="M285 665 V703 H560 V725" class="line"/><path d="M835 665 V703 H560" class="line"/>
<rect x="180" y="725" width="760" height="80" rx="10" class="head"/><text x="200" y="754" class="label">Output: parallel LOF/GOF binary head'ler veya üç sınıflı softmax</text><text x="200" y="782" class="small">BCE / cross-entropy · d = logit_GOF − logit_LOF · reverse MSE her validation/testte</text>
</svg>